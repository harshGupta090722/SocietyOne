name: Backend CI/CD — AWS EC2 (Docker)

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Verify TypeScript compiles before deploying
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript Compile Check
        working-directory: backend
        run: npx tsc --noEmit

      # Deploy to EC2 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          LANDLORD_SECRET_KEY: ${{ secrets.LANDLORD_SECRET_KEY }}
          TENANT_SECRET_KEY: ${{ secrets.TENANT_SECRET_KEY }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: MONGO_URL,LANDLORD_SECRET_KEY,TENANT_SECRET_KEY,ADMIN_SECRET_KEY,SMTP_USER,SMTP_PASS,FRONTEND_URL,WEBHOOK_SECRET
          script: |
            cd ~/SocietyOne
            git pull origin main

            cd backend
            
            # Auto-generate .env file from GitHub Secrets
            echo "PORT=4000" > .env
            echo "MONGO_URL=$MONGO_URL" >> .env
            echo "LANDLORD_SECRET_KEY=$LANDLORD_SECRET_KEY" >> .env
            echo "TENANT_SECRET_KEY=$TENANT_SECRET_KEY" >> .env
            echo "ADMIN_SECRET_KEY=$ADMIN_SECRET_KEY" >> .env
            echo "SMTP_HOST=smtp.gmail.com" >> .env
            echo "SMTP_PORT=587" >> .env
            echo "SMTP_USER=$SMTP_USER" >> .env
            echo "SMTP_PASS=$SMTP_PASS" >> .env
            echo "FRONTEND_URL=$FRONTEND_URL" >> .env
            echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> .env

            # Build and restart Docker container
            docker build -t societyone-backend .

            docker stop societyone-backend 2>/dev/null || true
            docker rm societyone-backend 2>/dev/null || true

            docker run -d \
              --name societyone-backend \
              --restart unless-stopped \
              -p 4000:4000 \
              -v ~/SocietyOne/backend/uploads:/app/uploads \
              --env-file ~/SocietyOne/backend/.env \
              societyone-backend

            # Cleanup dangling images to save disk space
            docker image prune -f

            # Verify container is running
            sleep 3
            docker ps | grep societyone-backend